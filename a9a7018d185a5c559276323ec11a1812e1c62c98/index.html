<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itinerari Mallorca | Juliol 2026</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
    <div class="container">
        <!-- Capçalera -->
        <header class="header">
            <h1><i class="fas fa-suitcase-rolling"></i> Mallorca 2026</h1>
            <p class="subtitle">14-18 de juliol | Viatge en parella</p>
            <p class="destino"><i class="fas fa-map-marker-alt"></i> Alaró, Serra de Tramuntana & Palma</p>
        </header>

        <!-- Pestanyes -->
        <div class="tabs-container">
            <nav class="tabs" id="tabsList"></nav>
        </div>

        <!-- Contingut dinàmic -->
        <main class="main-content">
            <section class="day-header" id="dayHeader"></section>
            <div class="day-content" id="dayContent"></div>
        </main>

        <!-- Peu de pàgina -->
        <footer class="footer">
            <p>Itinerari creat per a unes vacances inoblidables</p>
            <p class="tip"><i class="fas fa-lightbulb"></i> Aquest pla és flexible. L'important és gaudir!</p>
        </footer>
    </div>

    <script src="./viatge.json"></script>
    <script src="./app.js"></script>
</body>
</html>
